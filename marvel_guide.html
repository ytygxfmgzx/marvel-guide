<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫威宇宙探险指南 | Marvel MCU Explorer</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fc;
            --card-bg: #ffffff;
            --primary: #ff3b30;
            --primary-hover: #e02d22;
            --accent-blue: #007aff;
            --accent-yellow: #ffcc00;
            --accent-purple: #af52de;
            --text-dark: #2c3e50;
            --text-muted: #7f8c8d;
            --border-radius: 18px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans SC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            padding-bottom: 60px;
            line-height: 1.6;
        }

        /* 顶部 Header */
        header {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.2);
            position: relative;
        }

        header h1 {
            font-family: 'Fredoka One', 'Noto Sans SC', cursive;
            font-size: 2.5rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        /* 控制与仪表盘 */
        .dashboard-container {
            max-width: 1100px;
            margin: -25px auto 30px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px 25px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .mode-toggle {
            display: flex;
            background: #f0f3f8;
            padding: 4px;
            border-radius: 30px;
        }

        .mode-btn {
            border: none;
            background: transparent;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .overall-progress {
            flex: 1;
            min-width: 250px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            background: #eef2f7;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #36d1dc, #5b86e5);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        /* 无限宝石搜寻面板 */
        .stones-panel {
            max-width: 1100px;
            margin: 0 auto 30px;
            padding: 0 20px;
        }

        .stones-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .stones-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
        }

        .stones-list {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stone-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .stone-tag.unlocked {
            opacity: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stone-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        /* 主体内容布局 */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .phase-section {
            margin-bottom: 40px;
        }

        .phase-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .phase-title {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .phase-badge {
            background: #e3f2fd;
            color: #1976d2;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* 电影卡片 */
        .movie-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid transparent;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: #e2e8f0;
        }

        .movie-card.watched {
            background: #f4fbf7;
            border-color: #a3e635;
        }

        .movie-card.kids-highlight {
            border-color: var(--accent-yellow);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .movie-num {
            background: #f0f3f8;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .kids-tag {
            background: #fff9db;
            color: #f59f00;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid #ffe066;
        }

        .movie-title-cn {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .movie-title-en {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .movie-tagline {
            font-size: 0.85rem;
            color: #4a5568;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            line-height: 1.4;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-check {
            background: #edf2f7;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .movie-card.watched .btn-check {
            background: #22c55e;
            color: white;
        }

        .btn-detail {
            color: var(--accent-blue);
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
        }

        .card-top-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 9px;
            border-radius: 11px;
            font-size: 0.76rem;
            font-weight: 700;
            text-decoration: none;
            line-height: 1.4;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .rating-badge:hover { transform: translateY(-1px); box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .rating-badge.high  { background: #e7f8ee; color: #15803d; border: 1px solid #86efac; }
        .rating-badge.mid   { background: #fff4e6; color: #c2410c; border: 1px solid #fdba74; }
        .rating-badge.low   { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
        .rating-badge.empty { background: #fffbeb; color: #b45309; border: 1px dashed #fcd34d; }

        /* Header 资源徽章 */
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: white;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 0.92rem;
            font-weight: 700;
            margin-top: 16px;
            backdrop-filter: blur(4px);
        }

        /* 卡片/弹窗通用观看主按钮 */
        .btn-watch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(255, 65, 108, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-watch:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 65, 108, 0.45);
            color: white;
        }
        .btn-watch.pending {
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px dashed #cbd5e1;
            box-shadow: none;
            cursor: default;
            font-weight: 700;
        }
        .btn-watch.pending:hover { transform: none; box-shadow: none; }

        .modal-block.watch-block { border-color: var(--primary); }
        .modal-block.watch-block .watch-tip {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: -4px;
            line-height: 1.5;
        }

        .modal-block.douban { border-color: #15803d; }
        .modal-block.douban .db-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .modal-block.douban .db-rating {
            font-size: 1.1rem;
            font-weight: 900;
            color: #15803d;
        }
        .modal-block.douban .db-rating.pending {
            font-size: 0.9rem;
            font-weight: 700;
            color: #b45309;
        }
        .modal-block.douban .db-link {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
        }
        .modal-block.douban .db-link:hover { text-decoration: underline; }
        .modal-block.douban .db-link.pending { color: var(--text-muted); cursor: default; }

        /* Modal 弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: white;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f1f3f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-header h2 {
            font-size: 1.6rem;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .modal-header .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .modal-block {
            background: #f8fafc;
            padding: 15px 18px;
            border-radius: 14px;
            border-left: 4px solid var(--accent-blue);
        }

        .modal-block.key-point { border-color: var(--primary); }
        .modal-block.easter-egg { border-color: var(--accent-yellow); }

        .modal-block h4 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        .modal-block p {
            font-size: 0.9rem;
            color: #475569;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .dashboard-card { flex-direction: column; align-items: stretch; }
            .movie-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>漫威宇宙探险指南</h1>
        <p>不走弯路的逻辑观影顺序 · 让故事像完整史诗般展开</p>
        <div class="hero-badge">🎬 已收录 <span id="hero-watch-count">26</span> / 28 部夸克网盘片源</div>
    </header>

    <!-- 顶部控制台 & 进度 -->
    <div class="dashboard-container">
        <div class="dashboard-card">
            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-full" onclick="setMode('full')">全景观影路线 (28部+)</button>
                <button class="mode-btn" id="btn-kids" onclick="setMode('kids')">⭐ 10岁儿童精简路线 (12部)</button>
            </div>
            <div class="overall-progress">
                <div class="progress-header">
                    <span>观影进度</span>
                    <span id="progress-text">0 / 23</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 无限宝石搜寻器 -->
    <div class="stones-panel">
        <div class="stones-card">
            <div class="stones-title">💎 无限宝石搜寻记录：</div>
            <div class="stones-list">
                <div class="stone-tag" id="stone-space"><span class="stone-icon" style="background:#007aff;"></span>空间宝石 (蓝色)</div>
                <div class="stone-tag" id="stone-mind"><span class="stone-icon" style="background:#ffcc00;"></span>心灵宝石 (黄色)</div>
                <div class="stone-tag" id="stone-reality"><span class="stone-icon" style="background:#ff3b30;"></span>现实宝石 (红色)</div>
                <div class="stone-tag" id="stone-power"><span class="stone-icon" style="background:#af52de;"></span>力量宝石 (紫色)</div>
                <div class="stone-tag" id="stone-time"><span class="stone-icon" style="background:#34c759;"></span>时间宝石 (绿色)</div>
                <div class="stone-tag" id="stone-soul"><span class="stone-icon" style="background:#ff9500;"></span>灵魂宝石 (橙色)</div>
            </div>
        </div>
    </div>

    <!-- 电影列表主体 -->
    <main id="movie-content">
        <!-- JS 动态注入内容 -->
    </main>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal(null, true)">✕</button>
            <div class="modal-header">
                <h2 id="modal-title">电影名称</h2>
                <div class="subtitle" id="modal-subtitle">英文名 · 上映年份</div>
            </div>
            <div class="modal-body">
                <div class="modal-block watch-block" id="modal-watch-block">
                    <h4>☁ 夸克网盘片源</h4>
                    <a id="modal-watch-link" class="btn-watch" target="_blank" rel="noopener">打开夸克网盘 · 转存后观看 ➔</a>
                    <p class="watch-tip">点击进入夸克分享页，把影片保存到你的网盘即可在线观看或下载</p>
                    <p id="modal-watch-pending" style="display:none; font-size:0.85rem; color:var(--text-muted);">⏳ 片源整理中，敬请期待</p>
                </div>
                <div class="modal-block douban" id="modal-douban-block">
                    <h4>🎬 豆瓣</h4>
                    <div class="db-row">
                        <span id="modal-douban-rating"></span>
                        <a id="modal-douban-link" target="_blank" rel="noopener"></a>
                    </div>
                </div>
                <div class="modal-block">
                    <h4>📍 宇宙定位与主题</h4>
                    <p id="modal-position"></p>
                </div>
                <div class="modal-block key-point">
                    <h4>💡 必看关键线索</h4>
                    <p id="modal-focus"></p>
                </div>
                <div class="modal-block easter-egg">
                    <h4>🥚 重点关注彩蛋</h4>
                    <p id="modal-egg"></p>
                </div>
            </div>
        </div>
    </div>

            {
                id: 5, phase: 1, phaseName: "第一阶段：英雄诞生（认识这个世界）",
                title: "美国队长：复仇者先锋", enTitle: "Captain America: The First Avenger (2011)", kids: true, stone: "space",

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-full').classList.toggle('active', mode === 'full');
            document.getElementById('btn-kids').classList.toggle('active', mode === 'kids');
            renderMovies();

        function toggleWatched(movieId, event) {
            if(event) event.stopPropagation();
            if(watchedSet.has(movieId)) {
                watchedSet.delete(movieId);
            } else {
                watchedSet.add(movieId);
            }
            localStorage.setItem('mcu_watched', JSON.stringify([...watchedSet]));
            renderMovies();
            updateProgress();
        }

        function updateProgress() {

            const total = list.length;
            const pct = total === 0 ? 0 : Math.round((watchedCount / total) * 100);

            document.getElementById('progress-text').innerText = `${watchedCount} / ${total} (${pct}%)`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            // 更新宝石追踪
            const stoneMap = { space: false, mind: false, reality: false, power: false, time: false, soul: false };
            moviesData.forEach(m => {
                if(watchedSet.has(m.id) && m.stone) {
                    stoneMap[m.stone] = true;
                }
            });

            for(let stone in stoneMap) {
                const el = document.getElementById(`stone-${stone}`);
                if(el) {
                    if(stoneMap[stone]) el.classList.add('unlocked');
                    else el.classList.remove('unlocked');
                }
            }
        }

        function ratingBadgeHtml(movieId) {
            const db = doubanData[movieId] || {};
            const raw = db.rating;
            const hasRating = raw !== null && raw !== '' && !isNaN(Number(raw));
            const url = db.url;
            if(hasRating) {
                const r = Number(raw);
                const cls = r >= 8 ? 'high' : (r >= 7 ? 'mid' : 'low');
                const text = `⭐ ${r}`;
                return url
                    ? `<a class="rating-badge ${cls}" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${text}</a>`
                    : `<span class="rating-badge ${cls}">${text}</span>`;
            }
            if(url) {
                return `<a class="rating-badge empty" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">豆瓣 ➔</a>`;
            }
            return '';
        }

        function renderMovies() {
            const container = document.getElementById('movie-content');
            container.innerHTML = '';

            // 按 Phase 分组
            const phases = {};
            moviesData.forEach(m => {
                if(currentMode === 'kids' && !m.kids) return;
                if(!phases[m.phase]) {
                    phases[m.phase] = { name: m.phaseName, movies: [] };
                }
                phases[m.phase].movies.push(m);
            });

            for(let phaseKey in phases) {
                const phase = phases[phaseKey];
                const section = document.createElement('div');
                section.className = 'phase-section';

                let moviesHtml = phase.movies.map(m => {
                    const isWatched = watchedSet.has(m.id);
                    return `
                        <div class="movie-card ${isWatched ? 'watched' : ''} ${m.kids ? 'kids-highlight' : ''}" onclick="openModal(${m.id})">
                            <div class="card-top">
                                <span class="movie-num">#${m.id}</span>
                                <div class="card-top-right">
                                    ${ratingBadgeHtml(m.id)}
                                    ${m.kids ? '<span class="kids-tag">⭐ 儿童精选</span>' : ''}
                                </div>
                            </div>
                            <div class="movie-title-cn">${m.title}</div>
                            <div class="movie-title-en">${m.enTitle}</div>
                            <div class="movie-tagline">${m.tagline}</div>
                            ${quarkData[m.id]
                                ? `<a class="btn-watch" href="${quarkData[m.id]}" target="_blank" rel="noopener" onclick="event.stopPropagation()">☁ 夸克网盘片源</a>`
                                : `<span class="btn-watch pending">⏳ 片源整理中</span>`}
                            <div class="card-footer">
                                <button class="btn-check" onclick="toggleWatched(${m.id}, event)">
                                    ${isWatched ? '✓ 已看完' : '+ 标记已看'}
                                </button>
                                <span class="btn-detail">详情 ➔</span>
                            </div>
                        </div>
                    `;
                }).join('');

                section.innerHTML = `
                    <div class="phase-header">
                        <div class="phase-title">
                            ${phase.name}
                        </div>
                        <span class="phase-badge">${phase.movies.length} 部作品</span>
                    </div>
                    <div class="movie-grid">
                        ${moviesHtml}
                    </div>
                `;
                container.appendChild(section);
            }
        }

        /* Modal 控制 */
        function openModal(id) {
            const movie = moviesData.find(m => m.id === id);
            if(!movie) return;

            document.getElementById('modal-title').innerText = movie.title;
            document.getElementById('modal-subtitle').innerText = `${movie.enTitle} · Phase ${movie.phase}`;
            document.getElementById('modal-position').innerText = movie.position;
            document.getElementById('modal-focus').innerText = movie.focus;
            document.getElementById('modal-egg').innerText = movie.egg;

            const quarkUrl = quarkData[id];
            const watchLink = document.getElementById('modal-watch-link');
            const watchPending = document.getElementById('modal-watch-pending');
            if(quarkUrl) {
                watchLink.style.display = '';
                watchLink.setAttribute('href', quarkUrl);
                watchPending.style.display = 'none';
            } else {
                watchLink.style.display = 'none';
                watchPending.style.display = '';
            }

            const db = doubanData[id] || {};
            const raw = db.rating;
            const hasRating = raw !== null && raw !== '' && !isNaN(Number(raw));
            const hasUrl = !!db.url;
            const dbBlock = document.getElementById('modal-douban-block');
            const ratingEl = document.getElementById('modal-douban-rating');
            const linkEl = document.getElementById('modal-douban-link');
            if(!hasRating && !hasUrl) {
                dbBlock.style.display = 'none';
            } else {
                dbBlock.style.display = '';
                ratingEl.className = hasRating ? 'db-rating' : 'db-rating pending';
                ratingEl.innerText = hasRating ? `⭐ ${raw}` : '评分待填';
                if(hasUrl) {
                    linkEl.className = 'db-link';
                    linkEl.setAttribute('href', db.url);
                    linkEl.innerText = '在豆瓣查看 ➔';
                } else {
                    linkEl.className = 'db-link pending';
                    linkEl.removeAttribute('href');
                    linkEl.innerText = '链接待填';
                }
            }

            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal(event, force = false) {
            if(force || event.target.id === 'modal-overlay') {
                document.getElementById('modal-overlay').classList.remove('active');
            }
        }

        // 初始化运行
        init();
    </script>
</body>
</html>
